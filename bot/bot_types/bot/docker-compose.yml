version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: statify_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: statify_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - statify_network

  redis:
    image: redis:7-alpine
    container_name: statify_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - statify_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: statify_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/statify_hub
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - statify_network
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:

networks:
  statify_network:
    driver: bridge
